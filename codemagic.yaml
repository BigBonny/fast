# codemagic.yaml — FAST iOS App Store deployment
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# PREREQUISITES (set these in Codemagic UI → App settings → Environment variables):
#   APP_STORE_CONNECT_PRIVATE_KEY  — .p8 file content from App Store Connect →
#                                     Utilisateurs et accès → Intégrations → App Store Connect API
#   APP_STORE_CONNECT_KEY_IDENTIFIER  — Key ID (e.g. ABC1234XYZ)
#   APP_STORE_CONNECT_ISSUER_ID  — Issuer ID (shown above the keys table)
#
# The app will be built, signed, and uploaded to TestFlight automatically.

workflows:
  android-apk:
    name: FAST Android APK
    max_build_duration: 40
    environment:
      flutter: stable
      groups:
        - appstore_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: |
          cd "fastMobileApp/fastRestoBigbonney"
          flutter packages pub get
      - name: Set up Android signing
        script: |
          cd "fastMobileApp/fastRestoBigbonney"
          # FAST_KEYSTORE = base64 of fast-release.jks, FAST_KEYSTORE_PASSWORD = its password
          if [ -n "$FAST_KEYSTORE" ]; then
            echo "$FAST_KEYSTORE" | base64 --decode > android/fast-release.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=fast\nstoreFile=fast-release.jks\n" \
              "$FAST_KEYSTORE_PASSWORD" "$FAST_KEYSTORE_PASSWORD" > android/key.properties
            echo "Release keystore configured"
          else
            echo "FAST_KEYSTORE not set — falling back to debug signing"
          fi
      - name: Build APK
        script: |
          cd "fastMobileApp/fastRestoBigbonney"
          # No --build-number: pubspec version code must stay ahead of installed builds
          flutter build apk --release
    artifacts:
      - "fastMobileApp/fastRestoBigbonney/build/app/outputs/flutter-apk/app-release.apk"

  ios-app-store:
    name: FAST iOS App Store
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.fast.resto.fastRestoBigbonney"
        APP_NAME: "FAST"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: |
          cd "fastMobileApp/fastRestoBigbonney"
          flutter packages pub get
      - name: Flutter build (no codesign)
        script: |
          cd "fastMobileApp/fastRestoBigbonney"
          # Retry up to 3 times — CocoaPods CDN downloads can fail transiently
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt ==="
            flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER && exit 0
            echo "Attempt $attempt failed, cleaning Pods and retrying..."
            rm -rf ios/Pods ios/Podfile.lock
            sleep 5
          done
          echo "All attempts failed."
          exit 1
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Apply fetched profiles to Xcode project
        script: |
          cd "fastMobileApp/fastRestoBigbonney/ios"
          xcode-project use-profiles
      - name: Build and export IPA
        script: |
          cd "fastMobileApp/fastRestoBigbonney"
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"
    artifacts:
      - "fastMobileApp/fastRestoBigbonney/build/ios/ipa/*.ipa"
      - "fastMobileApp/fastRestoBigbonney/build/ios/ipa/*.dSYM.zip"
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
