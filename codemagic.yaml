# codemagic.yaml — FAST iOS App Store deployment
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# PREREQUISITES (set these in Codemagic UI → App settings → Environment variables):
#   APP_STORE_CONNECT_PRIVATE_KEY  — .p8 file content from App Store Connect →
#                                     Utilisateurs et accès → Intégrations → App Store Connect API
#   APP_STORE_CONNECT_KEY_IDENTIFIER  — Key ID (e.g. ABC1234XYZ)
#   APP_STORE_CONNECT_ISSUER_ID  — Issuer ID (shown above the keys table)
#
# The app will be built, signed, and uploaded to TestFlight automatically.

workflows:
  ios-app-store:
    name: FAST iOS App Store
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.fast.resto.fastRestoBigbonney"
        APP_NAME: "FAST"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: |
          cd "fastMobileApp/fastRestoBigbonney"
          flutter packages pub get
      - name: Flutter build (no codesign)
        script: |
          cd "fastMobileApp/fastRestoBigbonney"
          flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Apply fetched profiles to Xcode project
        script: |
          cd "fastMobileApp/fastRestoBigbonney/ios"
          xcode-project use-profiles
      - name: Build and export IPA
        script: |
          cd "fastMobileApp/fastRestoBigbonney"
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"
    artifacts:
      - "fastMobileApp/fastRestoBigbonney/build/ios/ipa/*.ipa"
      - "fastMobileApp/fastRestoBigbonney/build/ios/ipa/*.dSYM.zip"
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
